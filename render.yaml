version: "1"

databases:
  - name: karya-db
    databaseName: karya_db
    user: karya
    region: singapore
    plan: free

services:
  - type: web
    name: karya-api
    env: docker
    region: singapore
    plan: free
    healthCheckPath: /swagger/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: karya-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
